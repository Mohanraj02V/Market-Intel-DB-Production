name: CI & Deploy MarketIntel to Hostinger VPS (OIDC)

on:
  push:
    branches:
      - main
      - fix-architecture-security
  pull_request:
    branches:
      - main
      - fix-architecture-security
  workflow_dispatch:

# Least-privilege default permissions across all jobs.
# id-token: write is granted ONLY inside the protected deploy job.
permissions:
  contents: read

concurrency:
  group: marketintel-hostinger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend tests, migration checks, and Python dependency checks
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend Test & Security Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit

      - name: Verify dependency integrity (pip check)
        working-directory: backend
        run: pip check

      - name: Django checks & migration verification
        working-directory: backend
        run: |
          python manage.py check --settings=config.settings_test
          python manage.py makemigrations --check --dry-run --settings=config.settings_test

      - name: Run Django security & core regression tests
        working-directory: backend
        run: |
          python manage.py test \
            accounts.test_security_hardening \
            accounts.tests \
            accounts.test_email_templates \
            accounts.test_google_and_email_auth \
            transcriptions.tests \
            market_events.tests \
            email_ai.tests \
            digital_marketing.tests \
            whatsapp_ai.test_production_hardening \
            --settings=config.settings_test --verbosity=2

      - name: Static security analysis (Bandit)
        working-directory: backend
        run: bandit -r accounts companies prospects market_events whatsapp whatsapp_ai rag email_ai digital_marketing transcriptions utils config -ll -ii --exclude "*/tests*,*/migrations/*"

      - name: Audit Python dependencies (pip-audit)
        working-directory: backend
        run: pip-audit -r requirements.txt || echo "::warning::Review pip-audit findings before production cutover."

  # ---------------------------------------------------------------------------
  # 2. Frontend lint, unit tests, production build, and npm audit
  # ---------------------------------------------------------------------------
  frontend-test:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Build production SPA bundle
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://marketintel.hikasimat.com/api' }}
        run: npm run build

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high || echo "::warning::Review npm audit findings before production cutover."

  # ---------------------------------------------------------------------------
  # 3. Secret scanning (Gitleaks)
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 4. Build immutable commit-SHA artifacts & Trivy container vulnerability scan
  # ---------------------------------------------------------------------------
  build-artifacts:
    name: Build & Scan Release Artifacts
    needs: [backend-test, frontend-test, secret-scan]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend distribution tarball
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://marketintel.hikasimat.com/api' }}
        run: |
          npm ci
          npm run build
          mkdir -p ../release-artifacts
          tar -czf ../release-artifacts/frontend-dist.tar.gz -C dist .

      - name: Build immutable backend Docker image
        run: |
          docker build \
            --pull \
            -f deploy/hostinger/backend.Dockerfile \
            -t "marketintel-backend:${GITHUB_SHA}" \
            .

      - name: Scan backend container image with Trivy
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # 0.33.1
        with:
          image-ref: "marketintel-backend:${{ github.sha }}"
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Export backend Docker image tarball
        run: |
          docker save "marketintel-backend:${GITHUB_SHA}" | gzip -9 > release-artifacts/backend-image.tar.gz
          cp deploy/hostinger/docker-compose.production.yml release-artifacts/docker-compose.production.yml
          (cd release-artifacts && sha256sum * > SHA256SUMS)

      - name: Upload tested release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.sha }}
          path: release-artifacts/
          retention-days: 3

  # ---------------------------------------------------------------------------
  # 5. Protected Production Deployment via GitHub OIDC -> Vault -> Short-Lived SSH Cert
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Hostinger VPS KVM 2 (OIDC)
    needs: [build-artifacts]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix-architecture-security')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: marketintel-production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate Hostinger & Vault OIDC configuration
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_JWT_ROLE: ${{ vars.VAULT_JWT_ROLE }}
          VAULT_SSH_ROLE: ${{ vars.VAULT_SSH_ROLE }}
          HOSTINGER_VPS_HOST: ${{ vars.HOSTINGER_VPS_HOST }}
          HOSTINGER_VPS_KNOWN_HOSTS: ${{ vars.HOSTINGER_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for var in VAULT_ADDR VAULT_JWT_ROLE VAULT_SSH_ROLE HOSTINGER_VPS_HOST HOSTINGER_VPS_KNOWN_HOSTS; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error::Missing required GitHub environment variable: ${var}"
              exit 1
            fi
          done

      - name: Download tested release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ github.sha }}
          path: release-artifacts/

      - name: Verify release artifact checksums
        run: (cd release-artifacts && sha256sum -c SHA256SUMS)

      - name: Authenticate to HashiCorp Vault via GitHub OIDC & sign ephemeral SSH certificate
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_JWT_ROLE: ${{ vars.VAULT_JWT_ROLE }}
          VAULT_SSH_ROLE: ${{ vars.VAULT_SSH_ROLE }}
          VAULT_AUDIENCE: ${{ vars.VAULT_AUDIENCE || 'https://vault.marketintel' }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh

          # 1. Generate single-use ephemeral SSH keypair for this job only
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/deploy_ephemeral -C "gha-${GITHUB_RUN_ID}"

          # 2. Request GitHub OIDC JWT with explicit audience
          OIDC_TOKEN="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${VAULT_AUDIENCE}" | jq -r '.value')"

          # 3. Exchange GitHub OIDC JWT for short-lived Vault client token
          VAULT_TOKEN="$(curl -fsSL --request POST \
            --data "$(jq -n --arg role "${VAULT_JWT_ROLE}" --arg jwt "${OIDC_TOKEN}" '{role: $role, jwt: $jwt}')" \
            "${VAULT_ADDR%/}/v1/auth/jwt/login" | jq -r '.auth.client_token')"
          echo "::add-mask::${VAULT_TOKEN}"

          # 4. Ask Vault SSH Client Signer for a 5-minute SSH certificate bound to principal 'deploy'
          PUB_KEY="$(cat ~/.ssh/deploy_ephemeral.pub)"
          curl -fsSL --request POST \
            -H "X-Vault-Token: ${VAULT_TOKEN}" \
            --data "$(jq -n --arg pub "${PUB_KEY}" '{public_key: $pub, valid_principals: "deploy", cert_type: "user"}')" \
            "${VAULT_ADDR%/}/v1/ssh-client-signer/sign/${VAULT_SSH_ROLE}" \
            | jq -r '.data.signed_key' > ~/.ssh/deploy_ephemeral-cert.pub
          chmod 600 ~/.ssh/deploy_ephemeral-cert.pub

          # 5. Revoke Vault token immediately (no longer needed once cert is issued)
          curl -fsSL --request POST -H "X-Vault-Token: ${VAULT_TOKEN}" \
            "${VAULT_ADDR%/}/v1/auth/token/revoke-self" >/dev/null 2>&1 || true

      - name: Transfer artifacts and execute validated remote deployment
        env:
          HOSTINGER_VPS_HOST: ${{ vars.HOSTINGER_VPS_HOST }}
          HOSTINGER_VPS_PORT: ${{ vars.HOSTINGER_VPS_PORT || '22' }}
          HOSTINGER_VPS_KNOWN_HOSTS: ${{ vars.HOSTINGER_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          printf '%s\n' "${HOSTINGER_VPS_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          SSH_OPTS=(
            -p "${HOSTINGER_VPS_PORT}"
            -i ~/.ssh/deploy_ephemeral
            -o CertificateFile=~/.ssh/deploy_ephemeral-cert.pub
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=~/.ssh/known_hosts
            -o IdentitiesOnly=yes
            -o ForwardAgent=no
            -o ForwardX11=no
            -o BatchMode=yes
          )

          ssh "${SSH_OPTS[@]}" "deploy@${HOSTINGER_VPS_HOST}" \
            "mkdir -p /opt/marketintel/incoming/${GITHUB_SHA}"

          scp -P "${HOSTINGER_VPS_PORT}" \
            -i ~/.ssh/deploy_ephemeral \
            -o CertificateFile=~/.ssh/deploy_ephemeral-cert.pub \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o IdentitiesOnly=yes \
            release-artifacts/backend-image.tar.gz \
            release-artifacts/frontend-dist.tar.gz \
            release-artifacts/docker-compose.production.yml \
            "deploy@${HOSTINGER_VPS_HOST}:/opt/marketintel/incoming/${GITHUB_SHA}/"

          ssh "${SSH_OPTS[@]}" "deploy@${HOSTINGER_VPS_HOST}" \
            "sudo /usr/local/sbin/marketintel-deploy ${GITHUB_SHA}"

      - name: Verify public HTTPS endpoints after deployment
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://marketintel.hikasimat.com/health' }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://marketinteldbapp.hikasimat.com/' }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 "${API_HEALTH_URL}"
          curl -fsSI --max-time 10 "${FRONTEND_URL}" | head -n 5

      - name: Shred ephemeral SSH key and certificate
        if: always()
        run: rm -rf ~/.ssh/deploy_ephemeral ~/.ssh/deploy_ephemeral.pub ~/.ssh/deploy_ephemeral-cert.pub
