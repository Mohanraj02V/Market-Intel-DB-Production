name: CI & Deploy MarketIntel to Hostinger VPS

on:
  push:
    branches:
      - main
      - fix-architecture-security
  pull_request:
    branches:
      - main
      - fix-architecture-security
  workflow_dispatch:

# Least-privilege permissions across all jobs
permissions:
  contents: read

concurrency:
  group: marketintel-hostinger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend tests, Django checks, and Python security/dependency checks
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend Test & Security Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit

      - name: Verify dependency integrity (pip check)
        working-directory: backend
        run: pip check

      - name: Django system & migration checks
        working-directory: backend
        run: |
          python manage.py check --settings=config.settings_test
          python manage.py makemigrations --check --dry-run --settings=config.settings_test || \
            echo "::warning::Pending Django model migration drift detected; review before schema changes."

      - name: Run Django security & core regression tests
        working-directory: backend
        run: |
          python manage.py test \
            accounts.test_security_hardening \
            accounts.tests \
            accounts.test_google_and_email_auth \
            accounts.test_meeting_automation_webhooks \
            transcriptions.tests \
            digital_marketing.tests \
            prospects.test_email_tracking.TrackingEndpointTests \
            prospects.test_manager_dashboard \
            prospects.test_manager_email_activity \
            prospects.test_meeting_providers \
            prospects.test_google_meet_recording \
            whatsapp_ai.test_production_hardening \
            companies.tests \
            market_events.tests \
            --settings=config.settings_test --verbosity=2

      - name: Static security analysis (Bandit)
        working-directory: backend
        run: |
          bandit -r accounts companies prospects market_events whatsapp whatsapp_ai rag email_ai digital_marketing transcriptions utils config -ll -ii --exclude "*/tests*,*/migrations/*" || \
            echo "::warning::Review Bandit security findings above."

      - name: Audit Python dependencies (pip-audit)
        working-directory: backend
        run: pip-audit -r requirements.txt || echo "::warning::Review pip-audit findings above."

  # ---------------------------------------------------------------------------
  # 2. Frontend lint, unit tests, production build, and npm audit
  # ---------------------------------------------------------------------------
  frontend-test:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Build production SPA bundle
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://marketintel.hikasimat.com/api' }}
        run: npm run build

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high || echo "::warning::Review npm audit findings above."

  # ---------------------------------------------------------------------------
  # 3. Secret scanning (Gitleaks)
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 4. Build immutable commit-SHA artifacts & Trivy container vulnerability scan
  # ---------------------------------------------------------------------------
  build-artifacts:
    name: Build & Scan Release Artifacts
    needs: [backend-test, frontend-test, secret-scan]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix-architecture-security')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend distribution tarball
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://marketintel.hikasimat.com/api' }}
        run: |
          npm ci
          npm run build
          mkdir -p ../release-artifacts
          tar -czf ../release-artifacts/frontend-dist.tar.gz -C dist .

      - name: Build immutable backend Docker image
        run: |
          docker build \
            --pull \
            -f deploy/hostinger/backend.Dockerfile \
            -t "marketintel-backend:${GITHUB_SHA}" \
            .

      - name: Scan backend container image with Trivy
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # 0.33.1
        with:
          image-ref: "marketintel-backend:${{ github.sha }}"
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Export backend Docker image tarball
        run: |
          docker save "marketintel-backend:${GITHUB_SHA}" | gzip -9 > release-artifacts/backend-image.tar.gz
          cp deploy/hostinger/docker-compose.production.yml release-artifacts/docker-compose.production.yml
          (cd release-artifacts && sha256sum * > SHA256SUMS)

      - name: Upload tested release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.sha }}
          path: release-artifacts/
          retention-days: 3

  # ---------------------------------------------------------------------------
  # 5. Protected Production Deployment to Hostinger VPS KVM 2 (restricted deploy user)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Hostinger VPS KVM 2
    needs: [build-artifacts]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix-architecture-security')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: marketintel-production
    permissions:
      contents: read

    steps:
      - name: Validate Hostinger deployment configuration
        env:
          HOSTINGER_VPS_HOST: ${{ vars.HOSTINGER_VPS_HOST }}
          HOSTINGER_VPS_KNOWN_HOSTS: ${{ vars.HOSTINGER_VPS_KNOWN_HOSTS }}
          HAS_SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ -z "${HOSTINGER_VPS_HOST:-}" ]]; then
            echo "::error::Missing required GitHub environment variable: HOSTINGER_VPS_HOST"
            exit 1
          fi
          if [[ -z "${HOSTINGER_VPS_KNOWN_HOSTS:-}" ]]; then
            echo "::error::Missing required GitHub environment variable: HOSTINGER_VPS_KNOWN_HOSTS"
            exit 1
          fi
          if [[ "${HAS_SSH_KEY}" != "true" ]]; then
            echo "::error::Missing required GitHub environment secret: HOSTINGER_SSH_PRIVATE_KEY"
            exit 1
          fi

      - name: Download tested release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ github.sha }}
          path: release-artifacts/

      - name: Verify release artifact checksums
        run: (cd release-artifacts && sha256sum -c SHA256SUMS)

      - name: Configure restricted SSH client
        env:
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          HOSTINGER_VPS_KNOWN_HOSTS: ${{ vars.HOSTINGER_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${HOSTINGER_SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          printf '%s\n' "${HOSTINGER_VPS_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Transfer artifacts and execute atomic remote deployment
        env:
          HOSTINGER_VPS_HOST: ${{ vars.HOSTINGER_VPS_HOST }}
          HOSTINGER_VPS_PORT: ${{ vars.HOSTINGER_VPS_PORT || '22' }}
          HOSTINGER_VPS_USER: ${{ vars.HOSTINGER_VPS_USER || 'deploy' }}
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -p "${HOSTINGER_VPS_PORT}"
            -i ~/.ssh/deploy_key
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=~/.ssh/known_hosts
            -o IdentitiesOnly=yes
            -o ForwardAgent=no
            -o ForwardX11=no
            -o BatchMode=yes
          )

          ssh "${SSH_OPTS[@]}" "${HOSTINGER_VPS_USER}@${HOSTINGER_VPS_HOST}" \
            "mkdir -p /opt/marketintel/incoming/${GITHUB_SHA}"

          scp -P "${HOSTINGER_VPS_PORT}" \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o IdentitiesOnly=yes \
            release-artifacts/backend-image.tar.gz \
            release-artifacts/frontend-dist.tar.gz \
            release-artifacts/docker-compose.production.yml \
            "${HOSTINGER_VPS_USER}@${HOSTINGER_VPS_HOST}:/opt/marketintel/incoming/${GITHUB_SHA}/"

          ssh "${SSH_OPTS[@]}" "${HOSTINGER_VPS_USER}@${HOSTINGER_VPS_HOST}" \
            "sudo /usr/local/sbin/marketintel-deploy ${GITHUB_SHA}"

      - name: Verify public HTTPS endpoints after deployment
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://marketintel.hikasimat.com/api/health/' }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://marketinteldbapp.hikasimat.com/' }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 "${API_HEALTH_URL}"
          curl -fsSI --max-time 15 "${FRONTEND_URL}" | head -n 5

      - name: Remove temporary SSH key material
        if: always()
        run: rm -rf ~/.ssh/deploy_key ~/.ssh/known_hosts
