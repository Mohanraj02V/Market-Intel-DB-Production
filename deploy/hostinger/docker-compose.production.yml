# =============================================================================
# Hostinger VPS KVM 2 Production Compose (2 vCPU / 8 GB RAM / 100 GB NVMe)
# Services: PostgreSQL 16 (pgvector) + Django API + Campaign Worker + RAG Worker
# All internal ports are bound to loopback or private Docker network only.
# =============================================================================

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: marketintel-db
    restart: unless-stopped
    env_file:
      - /opt/marketintel/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketintel}
      POSTGRES_USER: ${POSTGRES_USER:-marketintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in /opt/marketintel/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - marketintel_pgdata:/var/lib/postgresql/data
    shm_size: 256m
    mem_limit: 1536m
    cpus: "0.8"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-marketintel} -d $${POSTGRES_DB:-marketintel}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - marketintel_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ${API_IMAGE:?API_IMAGE must be set to an immutable commit-SHA image tag}
    container_name: marketintel-api
    restart: unless-stopped
    env_file:
      - /opt/marketintel/.env
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /opt/marketintel/staticfiles:/app/staticfiles
      - /opt/marketintel/media:/app/media
    init: true
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: "1.2"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "X-Forwarded-Proto: https", "http://127.0.0.1:8000/api/health/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - marketintel_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  campaign-worker:
    image: ${API_IMAGE:?API_IMAGE must be set to an immutable commit-SHA image tag}
    container_name: marketintel-campaign-worker
    restart: unless-stopped
    command: ["python", "manage.py", "process_campaign_queue", "--poll-interval", "5"]
    env_file:
      - /opt/marketintel/.env
    volumes:
      - /opt/marketintel/media:/app/media
    init: true
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: "0.4"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - marketintel_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rag-worker:
    image: ${API_IMAGE:?API_IMAGE must be set to an immutable commit-SHA image tag}
    container_name: marketintel-rag-worker
    restart: unless-stopped
    command: ["python", "manage.py", "run_rag_worker", "--poll-interval", "3"]
    env_file:
      - /opt/marketintel/.env
    volumes:
      - /opt/marketintel/media:/app/media
    init: true
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: "0.4"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - marketintel_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  marketintel_pgdata:
    name: marketintel_pgdata

networks:
  marketintel_internal:
    driver: bridge
