# =============================================================================
# Hostinger VPS KVM 2 — Nginx Production Configuration
# Serves React + Vite SPA on marketinteldbapp.hikasimat.com
# Proxies Django REST API + Webhooks on marketintel.hikasimat.com
# =============================================================================

# Rate limiting zones (auth brute-force protection without throttling normal polling)
limit_req_zone $binary_remote_addr zone=mi_auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=mi_webhook_limit:10m rate=120r/m;

# ── HTTP -> HTTPS redirect (Frontend + API) ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name marketinteldbapp.hikasimat.com marketintel.hikasimat.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Frontend React + Vite SPA (marketinteldbapp.hikasimat.com) ───────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name marketinteldbapp.hikasimat.com;

    ssl_certificate     /etc/letsencrypt/live/marketinteldbapp.hikasimat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketinteldbapp.hikasimat.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /opt/marketintel/frontend/current;
    index index.html;

    # Security headers (compatible with Google/Zoom/Microsoft OAuth & rich email editors)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(self), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Immutable hashed Vite assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache SPA entry shell so new releases take effect immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── Backend Django REST API (marketintel.hikasimat.com) ──────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name marketintel.hikasimat.com;

    ssl_certificate     /etc/letsencrypt/live/marketintel.hikasimat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketintel.hikasimat.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Match Django attachment limit (30 MB)
    client_max_body_size 30M;

    # Static assets collected by Django
    location /static/ {
        alias /opt/marketintel/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Strictly block direct public access to private RAG documents
    location ^~ /media/rag_private/ {
        return 404;
    }

    # Public media (only used if USE_OBJECT_STORAGE=false)
    location /media/ {
        alias /opt/marketintel/media/;
        add_header X-Content-Type-Options "nosniff" always;
        expires 1d;
    }

    # Lightweight health check
    location = /health {
        proxy_pass http://127.0.0.1:8000/api/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Rate-limited authentication endpoints
    location ~ ^/api/auth/(login|google/login|refresh)/ {
        limit_req zone=mi_auth_limit burst=15 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webhook routes (WhatsApp, Meta, Zoom, CBE)
    location ~ ^/api/(whatsapp/webhook|transcriptions/webhooks|auth/webhooks|digital-marketing/webhooks)/ {
        limit_req zone=mi_webhook_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Main API, Admin, and OAuth frontend redirect routes
    location ~ ^/(api|admin|auth|digital-marketing)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_request_buffering off;
    }

    location / {
        return 404 "Market Intel DB API endpoint.";
    }
}
